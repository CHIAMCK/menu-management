services:
  postgres:
    image: postgres:16-alpine
    container_name: menu-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: menu_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d menu_management"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: menu-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 40s

  app:
    build: .
    container_name: menu-app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/menu_management?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      ORDER_QUEUE_NAME: order.placed
      MERCHANT_ID: "1"
      PORT: "8080"
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    container_name: menu-worker
    command: ["./worker"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      ORDER_QUEUE_NAME: order.placed
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
