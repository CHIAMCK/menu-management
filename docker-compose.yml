services:
  postgres:
    image: postgres:16-alpine
    container_name: menu-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: menu_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d menu_management"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    container_name: menu-app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/menu_management?sslmode=disable
      MERCHANT_ID: "1"
      PORT: "8080"
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
